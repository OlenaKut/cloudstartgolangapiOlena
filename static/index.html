<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Rock - Scissors - Bag</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(to right, #ece9e6, #ffffff);
        font-family: "Segoe UI", sans-serif;
      }
      .game-card {
        max-width: 500px;
        margin: 80px auto;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        background-color: #fff;
      }
      .game-title {
        font-size: 2.2rem;
        font-weight: bold;
        margin-bottom: 20px;
      }
      .choice-btn {
        width: 100px;
        height: 100px;
        font-size: 1.8rem;
        margin: 0 10px;
        border-radius: 50%;
      }
      .result-area,
      .stats-area {
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <div class="game-card text-center">
      <div class="game-title">🎮 Rock - Scissors - Bag</div>

      <div class="d-flex justify-content-center mb-4">
        <button
          class="btn btn-outline-primary choice-btn"
          onclick="play('STONE')"
        >
          🪨
        </button>
        <button
          class="btn btn-outline-success choice-btn"
          onclick="play('SCISSOR')"
        >
          ✂️
        </button>
        <button
          class="btn btn-outline-warning choice-btn"
          onclick="play('BAG')"
        >
          🧻
        </button>
      </div>

      <div class="result-area" id="result"></div>
      <div class="stats-area" id="stats"></div>
    </div>

    <script>
      async function play(selection) {
        try {
          const API_BASE = "https://stensax.home.kg";
          const res = await fetch(
            `${API_BASE}/api/play?yourSelection=${selection}`
          );
          const data = await res.json();
          const resultColor =
            data.winner === "You"
              ? "success"
              : data.winner === "Computer"
              ? "danger"
              : "secondary";

          document.getElementById("result").innerHTML = `
          <div class="alert alert-${resultColor}" role="alert">
            <strong>${
              data.winner === "Draw" ? "Draw!" : `Winner: ${data.winner}`
            }</strong><br>
            You chose: <b>${data.yourSelection}</b><br>
            Computer chose: <b>${data.computerSelection}</b>
          </div>
        `;

          const statsRes = await fetch(`${API_BASE}/api/stats`);
          const stats = await statsRes.json();
          document.getElementById("stats").innerHTML = `
          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">📊 Statistics</h5>
              <p class="card-text">
                Total played: <b>${stats.totalGames}</b><br>
                Your winnings: <b>${stats.wins}</b><br>
                
              </p>
            </div>
          </div>
        `;
        } catch (err) {
          document.getElementById("result").innerHTML = `
          <div class="alert alert-danger">Something went wrong! 😢</div>
        `;
          console.error(err);
        }
      }
    </script>
  </body>
</html>
